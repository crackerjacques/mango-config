# Monitor Rules

source_optional=~/.config/rgds-scale/monitor.conf
# RG DS: DSI-2 is the top panel, DSI-1 the bottom one, stacked like a DS
monitor_rule=name:^DSI-2$,x:0,y:0,primary:1
monitor_rule=name:^DSI-1$,x:0,y:480
source_optional=~/.config/rgds-scale/monitor.conf
# Touch: rgds-touch republishes the two identical Goodix panels under these
# names (picked by i2c controller), so each can be pinned to its own screen
device_rule=name:rgds-touch-top,monitor:DSI-2
device_rule=name:rgds-touch-bottom,monitor:DSI-1
