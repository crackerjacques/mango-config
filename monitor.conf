# Monitor Rules
# monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:10,scale:1,vrr:0,rr:0
# RG Vita Pro: the panel is mounted portrait and mango ignores the DRM
# panel-orientation property, so turn it here (rr:1 = 90 degrees, the
# same as vita-screen's xrandr "left" on X11). scale:1.5 because 1080p at
# ~400ppi is unreadably small at 1.
monitorrule=name:^DSI-1$,rr:1,scale:1.5
