# Monitor Rules
# monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:10,scale:1,vrr:0,rr:0
# RG DS: DSI-2 is the top panel, DSI-1 the bottom one, stacked like a DS
monitorrule=name:^DSI-2$,width:640,height:480,x:0,y:0,primary:1
monitorrule=name:^DSI-1$,width:640,height:480,x:0,y:480
# Touch: rgds-touch republishes the two identical Goodix panels under these
# names (picked by i2c controller), so each can be pinned to its own screen
devicerule=name:rgds-touch-top,monitor:DSI-2
devicerule=name:rgds-touch-bottom,monitor:DSI-1
