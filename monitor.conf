# Monitor Rules
# monitor_rule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:10,scale:1,vrr:0,rr:0
# Raspberry Pi: no fixed screen. HDMI, the Touch Display 2 (DSI) or a small
# SPI panel all start at mango's defaults; Display (rpi-scale) sets the scale
# and rotation of each screen in this file.
source_optional=~/.config/rpi-scale/monitor.conf
